[project]
name = "forensic-validator"
version = "0.1.0"
description = "Adli araç ve yöntem doğrulama uygulaması (öğrenme projesi)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
forensic-validator = "forensic_validator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forensic_validator"]
