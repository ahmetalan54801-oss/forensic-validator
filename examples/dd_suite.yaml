suite: "dd adli imaging aracı doğrulama testi"
cases:
  - name: "dd bit-bit imaj alırken kaynak dosyayla aynı hash'i üretir"
    vars:
      input: "sample_input.bin"
      output: "dd_output.img"
    command: "dd if={input} of={output} bs=1M"
    expect:
      exit_code: 0
      files_match:
        a: "{input}"
        b: "{output}"
        algo: sha256

  - name: "dd üretilen imaj bilinen hash ile eşleşir"
    vars:
      input: "sample_input.bin"
      output: "dd_output2.img"
    command: "dd if={input} of={output} bs=4096"
    expect:
      exit_code: 0
      file_hash:
        path: "{output}"
        algo: sha256
        expected: "032e4cffad3bd626471e4aa19f6b94091dcc3d9dbddfa85a6a6d15d57e0b5bdf"

  - name: "dd hatalı girdi dosyasında hata verir"
    vars:
      missing: "does_not_exist.bin"
      output: "should_not_exist.img"
    command: "dd if={missing} of={output}"
    expect:
      exit_code: 1
      stderr_contains: "No such file"

  - name: "dd count parametresiyle sadece istenen kadar veriyi kopyalar"
    vars:
      input: "sample_input.bin"
      output: "dd_partial_head.img"
    command: "dd if={input} of={output} bs=1 count=512"
    expect:
      exit_code: 0
      files_match:
        a: "sample_input_first512.bin"
        b: "{output}"
        algo: sha256

  - name: "dd skip parametresiyle doğru offsetten veriyi okur"
    vars:
      input: "sample_input.bin"
      output: "dd_partial_mid.img"
    command: "dd if={input} of={output} bs=1 skip=1000 count=512"
    expect:
      exit_code: 0
      files_match:
        a: "sample_input_mid512.bin"
        b: "{output}"
        algo: sha256

  - name: "farklı blok boyutu (bs=1) yine de bit-bit doğru kopya üretir"
    vars:
      input: "sample_input.bin"
      output: "dd_output_bs1.img"
    command: "dd if={input} of={output} bs=1"
    expect:
      exit_code: 0
      files_match:
        a: "{input}"
        b: "{output}"
        algo: sha256
